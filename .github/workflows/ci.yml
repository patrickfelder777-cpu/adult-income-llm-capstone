name: Adult Income Capstone CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Train and test project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Display Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            src/data_loader.py \
            src/preprocess.py \
            src/evaluate.py \
            src/train.py \
            src/compare_experiments.py \
            src/llm_parser.py \
            src/app.py

      - name: Download Adult Income dataset
        run: python -m src.data_loader

      - name: Train models with MLflow
        run: python -m src.train

      - name: Compare MLflow experiments
        run: python -m src.compare_experiments

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Verify generated model
        run: |
          test -f models/best_model.joblib
          test -f models/best_model_metadata.json

      - name: Verify experiment reports
        run: |
          test -f reports/training_results.csv
          test -f reports/mlflow_experiment_comparison.csv
          test -f reports/best_mlflow_run.json